# JAKA multi-robot registry example
# One teleop group can have exactly one operator and one or more followers.

[robot:leader]
name=Leader Arm
model=JAKA Mini2
ip=192.168.1.101
enabled=1
filter=lpf
lpf_cutoff=2.5
max_velocity=1.0
max_acceleration=8.0
lower_deg=-360,-125,-130,-360,-120,-360
upper_deg=360,125,130,360,120,360
direction=1,1,1,1,1,1
safe_pose_deg=100,45,-90,0,-90,0

[robot:follower_a]
name=Follower A
model=JAKA Mini2
ip=192.168.1.102
enabled=1
filter=lpf
lpf_cutoff=2.5
max_velocity=1.0
max_acceleration=8.0
lower_deg=-360,-125,-130,-360,-120,-360
upper_deg=360,125,130,360,120,360
direction=1,1,1,1,1,1
safe_pose_deg=-80,45,-90,0,-90,-90

[robot:follower_b]
name=Follower B
model=JAKA Mini2
ip=192.168.1.103
enabled=1
filter=lpf
lpf_cutoff=2.5
max_velocity=1.0
max_acceleration=8.0
lower_deg=-360,-125,-130,-360,-120,-360
upper_deg=360,125,130,360,120,360
direction=1,1,1,1,1,1
safe_pose_deg=-80,45,-90,0,-90,-90

[group:group_a]
name=Dual follower teleoperation
operator=leader
followers=follower_a,follower_b
